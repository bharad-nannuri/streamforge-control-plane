services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: streamforge-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  postgres:
    image: postgres:16-alpine
    container_name: streamforge-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingestion-service:
    build: { context: ., dockerfile: services/ingestion-service/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/streamforge
      DB_USER: streamforge
      DB_PASSWORD: streamforge
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  downstream-simulator:
    build: { context: ., dockerfile: services/downstream-simulator/Dockerfile }
    ports: ["8083:8083"]

  processor-service:
    build: { context: ., dockerfile: services/processor-service/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/streamforge
      DB_USER: streamforge
      DB_PASSWORD: streamforge
      DOWNSTREAM_URL: http://downstream-simulator:8083
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      downstream-simulator: { condition: service_started }

  control-plane-service:
    build: { context: ., dockerfile: services/control-plane-service/Dockerfile }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/streamforge
      DB_USER: streamforge
      DB_PASSWORD: streamforge
      INGESTION_URL: http://ingestion-service:8081
      PROCESSOR_URL: http://processor-service:8082
      DOWNSTREAM_URL: http://downstream-simulator:8083
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      ingestion-service: { condition: service_started }
      processor-service: { condition: service_started }
