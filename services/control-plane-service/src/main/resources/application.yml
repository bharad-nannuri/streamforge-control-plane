server:
  port: 8080
spring:
  application:
    name: control-plane-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamforge}
    username: ${DB_USER:streamforge}
    password: ${DB_PASSWORD:streamforge}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
streamforge:
  ingestion-url: ${INGESTION_URL:http://localhost:8081}
  processor-url: ${PROCESSOR_URL:http://localhost:8082}
  downstream-url: ${DOWNSTREAM_URL:http://localhost:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
