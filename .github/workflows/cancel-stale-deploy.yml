name: cancel-stale-streamforge-deploy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cancel-stale-deploy.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/bharad-nannuri/streamforge-control-plane/actions/runs/39709724001/cancel
