name: build

on:
  push:
    branches: ["main", "bootstrap/v1-core-runtime", "deploy/cloudflare-labs"]
  pull_request:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify

  cloudflare-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloudflare demo image
        run: docker build -f Dockerfile.cloudflare -t streamforge-demo:ci .
